name: Deploy to Droplet

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docker-compose.prod.yml'
      - 'nginx/**'
      - 'scripts/deploy-prod.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Queue deploys so only one Actions job targets the droplet at a time.
# Pair with scripts/deploy-prod.sh flock for races with manual SSH deploys.
concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Cold Nuxt+Maven builds on the 1-vCPU droplet routinely exceed 20–25m.
          command_timeout: 45m
          script: |
            set -euo pipefail
            cd /root/crypto-arbitrage
            echo "=== git remote / HEAD before pull ==="
            git remote -v | sed -E 's#https://[^@]+@#https://***@#g'
            git rev-parse HEAD || true
            git fetch origin main
            git reset --hard origin/main
            echo "=== HEAD after sync ==="
            git rev-parse HEAD
            git log -1 --oneline
            chmod +x scripts/deploy-prod.sh
            ./scripts/deploy-prod.sh
