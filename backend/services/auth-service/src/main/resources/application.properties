server.port=8083

spring.application.name=auth-service

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cryptodb}
spring.datasource.username=${DB_USERNAME:cryptouser}
spring.datasource.password=${DB_PASSWORD:cryptopass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# API Path
spring.jersey.application-path=/api

# App
app.encryption.key=${ENCRYPTION_KEY:MySuperSecretKeyForDevelopmentMustBeChangedInProd}

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/api-docs
app.admin.wallet=${APP_ADMIN_WALLET:}
