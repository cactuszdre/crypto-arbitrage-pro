spring.application.name=funding-service
server.port=8081

# Jersey Configuration
spring.jersey.application-path=/api

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cryptodb}
spring.datasource.username=${DB_USERNAME:cryptouser}
spring.datasource.password=${DB_PASSWORD:cryptopass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Security
app.encryption.key=${ENCRYPTION_KEY:MySuperSecretKey}

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Logging
logging.level.com.crypto.funding=INFO
logging.level.org.hibernate.SQL=OFF

# Scheduler
spring.task.scheduling.pool.size=5

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# OpenAPI/Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
