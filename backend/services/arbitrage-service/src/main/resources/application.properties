spring.application.name=arbitrage-service
server.port=8082

# Jersey Configuration
spring.jersey.application-path=/api

# PostgreSQL Database (same as funding-service for shared data)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cryptodb}
spring.datasource.username=${DB_USERNAME:cryptouser}
spring.datasource.password=${DB_PASSWORD:cryptopass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway - disabled in arbitrage-service (funding-service handles migrations)
spring.flyway.enabled=false

# Inter-service communication
funding.service.url=http://localhost:8081/api

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Logging
logging.level.com.crypto.arbitrage=INFO
logging.level.org.hibernate.SQL=OFF

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# OpenAPI/Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
