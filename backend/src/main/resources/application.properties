spring.application.name=crypto-arbitrage
server.port=8080

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cryptodb}
spring.datasource.username=${DB_USERNAME:cryptouser}
spring.datasource.password=${DB_PASSWORD:cryptopass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Do not hold a DB connection for the whole HTTP request; the fetch schedulers
# already compete for the pool and web traffic must not queue behind them.
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Security
app.encryption.key=${ENCRYPTION_KEY:MySuperSecretKey}
app.admin.wallet=${APP_ADMIN_WALLET:}

# JWT Authentication
# IMPORTANT: Set a strong JWT_SECRET in production (at least 32 characters)
jwt.secret=${JWT_SECRET:change-this-to-a-very-long-and-secure-secret-key-in-production}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

# HikariCP Connection Pool
# Modest headroom over the previous 10: connections are now held for milliseconds,
# and each extra Postgres backend costs memory on this 2 GB host.
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
# Logs a stack trace for any connection held longer than 20s, which is how the
# pool got exhausted by transactions spanning HTTP calls.
spring.datasource.hikari.leak-detection-threshold=20000

# Bounded so a stuck transaction fails loudly instead of pinning a connection
# indefinitely; batch jobs delete/aggregate in chunks to stay well under this.
spring.transaction.default-timeout=60

# Logging
logging.level.com.crypto.arbitrage=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# Scheduler
spring.task.scheduling.pool.size=5

# Actuator (health checks + metrics for diagnosing pool/JVM saturation)
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# Mistral AI
mistral.api.key=${MISTRAL_API_KEY:}

