spring.application.name=crypto-arbitrage
server.port=8080

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cryptodb}
spring.datasource.username=${DB_USERNAME:cryptouser}
spring.datasource.password=${DB_PASSWORD:cryptopass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Security
app.encryption.key=${ENCRYPTION_KEY:MySuperSecretKey}
app.admin.wallet=${APP_ADMIN_WALLET:}

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Logging
logging.level.com.crypto.arbitrage=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# Scheduler
spring.task.scheduling.pool.size=5

# Actuator (DigitalOcean health checks)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Mistral AI
mistral.api.key=${MISTRAL_API_KEY:}

# Variational DEX Configuration
# Set to false in production if Variational API blocks datacenter IPs
variational.enabled=${VARIATIONAL_ENABLED:true}
# Cloudflare Worker proxy URL (leave empty to call Variational directly)
# Example: https://variational-proxy.your-account.workers.dev
variational.proxy.url=${VARIATIONAL_PROXY_URL:}
