# =====================================================
# ÉTAPE 1 : Config HTTP temporaire pour obtenir le SSL
# Une fois le certificat obtenu, utilise default.conf
# =====================================================
server {
    listen 80;
    server_name cactusfund.app www.cactusfund.app;

    # Pour Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'Droplet OK - SSL en cours de configuration';
        add_header Content-Type text/plain;
    }
}
