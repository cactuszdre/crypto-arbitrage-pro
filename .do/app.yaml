name: crypto-arbitrage-pro

services:
  - name: backend
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    github:
      branch: main
      deploy_on_push: true
      repo: cactuszdre/crypto-arbitrage-pro
    http_port: 8080
    instance_size_slug: basic-xxs
    envs:
      - key: SPRING_DATASOURCE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: SPRING_DATASOURCE_USERNAME
        scope: RUN_TIME
        value: ${db.USERNAME}
      - key: SPRING_DATASOURCE_PASSWORD
        scope: RUN_TIME
        value: ${db.PASSWORD}

  - name: frontend
    source_dir: frontend
    github:
      branch: main
      deploy_on_push: true
      repo: cactuszdre/crypto-arbitrage-pro
    build_command: npm install && npm run build
    environment_slug: node-js
    instance_size_slug: basic-xxs
    envs:
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: ${backend.PUBLIC_URL}

static_sites:
  - name: frontend-site
    source_dir: frontend
    github:
      branch: main
      deploy_on_push: true
      repo: cactuszdre/crypto-arbitrage-pro
    build_command: npm install && npm run build
    output_dir: dist
    catchall_document: index.html

databases:
  - name: db
    engine: MYSQL
    version: "8"
